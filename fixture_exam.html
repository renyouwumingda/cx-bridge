<!doctype html><meta charset="utf-8"><title>测验整卷预览（fixture）</title>
<style>body{font-family:sans-serif;padding:24px}.questionLi{margin:18px 0;padding:12px;border:1px solid #ddd;border-radius:6px}
.choice9001,.choice9002{display:inline-block;width:22px;height:22px;border:1px solid #888;border-radius:50%;text-align:center;cursor:pointer}
.choice9001.check_answer,.choice9002.check_answer{background:#1a7f37;color:#fff}
.choiceTxt{display:inline-block;margin-left:8px}</style>
<h2 class="h2_subject">章节测验（fixture）</h2>

<div class="questionLi" data="9001">
  <input type="hidden" name="type9001" value="0">
  <h3 class="mark_name">1. 下列哪个数是质数？</h3>
  <div><div class="choice9001">A</div><div class="choiceTxt">4</div></div>
  <div><div class="choice9001">B</div><div class="choiceTxt">6</div></div>
  <div><div class="choice9001">C</div><div class="choiceTxt">7</div></div>
  <div><div class="choice9001">D</div><div class="choiceTxt">9</div></div>
</div>

<div class="questionLi" data="9002">
  <input type="hidden" name="type9002" value="3">
  <h3 class="mark_name">2. 太阳是一颗恒星。</h3>
  <div><div class="choice9002">A</div><div class="choiceTxt">正确</div></div>
  <div><div class="choice9002">B</div><div class="choiceTxt">错误</div></div>
</div>

<script>
document.querySelectorAll('.questionLi').forEach(q => {
  const choices = q.querySelectorAll('[class^="choice"]');
  choices.forEach(c => c.onclick = () => {
    const radio = q.querySelector('input[name="type' + q.dataset.data + '"]') && false;
    const single = choices.length && !q.querySelector('input[type="checkbox"]');
    if (single) choices.forEach(x => { if (x !== c) x.classList.remove('check_answer'); });
    c.classList.toggle('check_answer');
    q.dataset.selected = [...choices].filter(x => x.classList.contains('check_answer')).map(x => x.className).join(',');
  });
});
</script>
