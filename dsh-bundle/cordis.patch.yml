# 两行：一个可见的插件条目（dsh-cx-bridge）+ 一个 MCP 连接（dsh-cx-bridge-mcp）。
# 换机器时改 mcp 行下面两处绝对路径：node 可执行文件、cx-mcp.js。
- insert:
    - id: dsh-cx-bridge
      name: 'dsh-cx-bridge'
    - id: dsh-cx-bridge-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cx-bridge
        transport: stdio
        command: 'C:\node-v24.14.0-win-x64\node.exe'
        args:
          - 'C:\Users\10183\Desktop\ds\cx-bridge\cx-mcp.js'
        toolCallTimeoutMs: 120000
