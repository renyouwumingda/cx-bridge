<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>章节刷课 fixture</title>
<style>body{font:14px/1.6 system-ui;margin:20px} .chapter_item{padding:6px;border-bottom:1px solid #eee}
.posCatalog_select{display:inline-block;margin:6px;padding:6px 10px;border:1px solid #ccc;cursor:pointer}</style>
</head><body>
<div id="app"></div>
<script>
const p = new URLSearchParams(location.search);
const mode = p.get('mode') || 'course';
const app = document.getElementById('app');

function course() {
  const items = [
    ['第1章 电磁学基础', true],
    ['第2章 稳恒磁场', false],
    ['第3章 电磁感应', false],
  ];
  if (p.get('alldone') === '1') items.forEach(x => x[1] = true);
  if (p.get('v') === 'new') {
    // 新版/学校自建页：章节是 h3，innerHTML 里带 chapterId，没有 .chapter_item
    app.innerHTML = items.map(([name, done], i) =>
      '<h3 class="cell" data-cid="chapterId=' + (1000 + i) + '"' +
      ' onclick="location.href=&quot;fixture_chapter.html?mode=study&ch=' + i + '&quot;">' + name +
      (done ? ' <span class="icon blue">已完成</span>' : '') + '</h3>').join('');
    return;
  }
  app.innerHTML = items.map(([name, done], i) =>
    '<div class="chapter_item">' +
      '<a href="javascript:void(0)" onclick="location.href=\'fixture_chapter.html?mode=study&ch=' + i + '\'">' + name + '</a>' +
      (done ? ' <span class="icon blue">已完成</span>' : ' <span>未完成</span>') +
    '</div>').join('');
}

function makeVideo() {
  const v = document.createElement('video');
  let t = 0;
  Object.defineProperty(v, 'duration', { get: () => 4 });
  Object.defineProperty(v, 'currentTime', { get: () => t, set: x => { t = x; } });
  Object.defineProperty(v, 'paused', { get: () => !v._playing });
  Object.defineProperty(v, 'ended', { get: () => t >= 3 });
  v.muted = false; v.playbackRate = 1;
  v.play = () => {
    v._playing = true;
    v._timer = setInterval(() => { t += 0.5; if (t >= 3) { clearInterval(v._timer); v._playing = false; } }, 300);
    return Promise.resolve();
  };
  v.pause = () => { v._playing = false; };
  return v;
}

function study() {
  app.innerHTML = '<h3>第2章 稳恒磁场</h3>' +
    '<div class="posCatalog_select firstLayer" id="881199632"><span class="posCatalog_title posCatalog_rotate titleIcon">1 导论</span></div>' +
    '<div class="posCatalog_select" id="cur_task1"><span class="posCatalog_name" title="2.1 磁场视频（40 min）">2.1 磁场视频（40 min）</span></div>' +
    '<div class="posCatalog_select" id="cur_task2"><span class="posCatalog_name" title="2.2 章节测验（10 题）">2.2 章节测验（10 题）</span></div>' +
    '<div id="iframe_content"></div><div id="task-area"></div>';
  if (p.get('audio') === '1') {
    document.getElementById('cur_task1').onclick = () => {
      const box = document.createElement('div');
      box.className = 'audioReader';
      const a = document.createElement('audio');
      a.id = 'a1';
      box.appendChild(a);
      document.getElementById('task-area').appendChild(box);
      let cur = 0, ended = false, rate = 1, paused = true;
      Object.defineProperty(a, 'duration', { get: () => 4 });
      Object.defineProperty(a, 'currentTime', { get: () => cur });
      Object.defineProperty(a, 'ended', { get: () => ended });
      Object.defineProperty(a, 'paused', { get: () => paused });
      Object.defineProperty(a, 'playbackRate', { get: () => rate, set: v => { rate = v; } });
      a.play = () => { paused = false; clearInterval(a._t); a._t = setInterval(() => { cur += 0.2 * rate; if (cur >= 3) { cur = 3; ended = true; paused = true; clearInterval(a._t); } }, 200); return Promise.resolve(); };
      a.pause = () => { paused = true; clearInterval(a._t); };
    };
    return;
  }
  document.getElementById('cur_task1').onclick = () => {
    if (p.get('xorigin') === '2') {
      const fx = document.createElement('iframe');
      fx.src = p.get('player') || 'http://localhost:8798/ananas/modules/video/index.html';
      fx.style.cssText = 'width:300px;height:80px';
      document.getElementById('iframe_content').innerHTML = '';
      document.getElementById('iframe_content').appendChild(fx);
      return;
    }
    if (p.get('xorigin') === '1') {
      const fx = document.createElement('iframe');
      fx.src = 'http://127.0.0.1:9/player.html';
      fx.style.cssText = 'width:300px;height:80px';
      document.getElementById('iframe_content').innerHTML = '';
      document.getElementById('iframe_content').appendChild(fx);
      return;
    }
    const f = document.createElement('iframe');
    f.style.cssText = 'width:300px;height:80px';
    f.srcdoc = '<video id="v"></video>';
    document.getElementById('iframe_content').innerHTML = '';
    // 真实页播放器是懒加载的：延迟 900ms 再把 iframe 挂上来
    setTimeout(() => document.getElementById('iframe_content').appendChild(f), 900);
    f.onload = () => {
      const v = f.contentDocument.getElementById('v');
      if (p.get('stall') === '1') {
        Object.defineProperty(v, 'duration', { get: () => 4 });
        Object.defineProperty(v, 'currentTime', { get: () => 0 });
        Object.defineProperty(v, 'paused', { get: () => false });
        Object.defineProperty(v, 'ended', { get: () => false });
        v.play = () => Promise.resolve();
        return;
      }
      const mock = makeVideo();
      Object.defineProperty(v, 'duration', { get: () => 4 });
      let t = 0;
      Object.defineProperty(v, 'currentTime', { get: () => t, set: x => { t = x; } });
      Object.defineProperty(v, 'paused', { get: () => !v._playing });
      Object.defineProperty(v, 'ended', { get: () => t >= 3 });
      v.play = () => { v._playing = true; v._timer = setInterval(() => { t += 0.5; if (t >= 3) { clearInterval(v._timer); v._playing = false; } }, 300); return Promise.resolve(); };
      v.pause = () => { v._playing = false; };
    };
  };
}

mode === 'study' ? study() : course();
</script>
</body></html>
