;" class="fl after" onclick="javascript:void(0);">线圈垂直磁场平移.</a><div class="clear"></div></li><li><label class="fl before"><input name="answer215107225" type="radio" value="C">&nbsp;&nbsp;C </label><a href="javascript:void(0);" class="fl after" onclick="javascript:void(0);">线圈绕垂直于磁场的轴转动.</a><div class="clear"></div></li><li><label class="fl before"><input name="answer215107225" type="radio" value="D">&nbsp;&nbsp;D </label><a href="javascript:void(0);" class="fl after" onclick="javascript:void(0);">线圈静止.</a><div class="clear"></div></li></ul><input type="hidden" name="answertype215107225" value="0" id="answertype215107225"></div><div class="Py_answer clearfix"></div></div></div></body></html>
